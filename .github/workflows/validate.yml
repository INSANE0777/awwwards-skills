name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Validate structure, links, LICENSE, JSON and routing
        run: node scripts/validate-skills.mjs

      - name: Test skill-memory
        run: node --test scripts/skill-memory.test.mjs

      - name: Install smoke (skills CLI 1.7.6)
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          npx -y skills@1.7.6 add . --all --copy
          node -e "const fs=require('fs'),p=require('path'),dir='.agents/skills';const want=['awwwards-setup','awwwards-inspiration','recreate','awwwards-motion-study','awwwards-section-loop','motion-authoring','awwwards-doctor'];const got=fs.readdirSync(dir).filter(n=>fs.statSync(p.join(dir,n)).isDirectory()&&!n.startsWith('.'));if(got.length!==7||want.some(n=>!got.includes(n))){console.error('expected 7 skill dirs in '+dir+', got: '+got.join(', '));process.exit(1);}console.log('installed 7 skills: '+got.join(', '));"
